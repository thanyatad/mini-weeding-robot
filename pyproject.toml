[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-weeding-robot"
version = "0.0.0"
description = "Controller and perception for the 4-wheel weeding rover MVP"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = [
    "controller",
    "controller.motion",
    "controller.rover",
    "controller.safety",
    "controller.workflow",
    "perception",
]

[tool.pytest.ini_options]
# Repo root on sys.path: controller/, perception/ and tests/ are imported as
# top-level packages without installing anything.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "isaac: needs a running Isaac Sim (never collected in tests/unit)",
    "hardware: needs the ESP32 board attached",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown is documentation, and in this repo the documentation is the spec.
# `ruff format` will happily reformat Python fenced in a .md file otherwise.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
