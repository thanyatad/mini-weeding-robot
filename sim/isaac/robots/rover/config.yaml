# sim/isaac/robots/rover/config.yaml — physics values for the wheel joints
#
# These are the numbers that `rover.usd` authors.  They live here as well
# because a .usda diff is hard to read and Stage 3 (physics tuning) is the
# longest job in V1 — the person doing it needs one readable place to look.
#
# The two files cannot drift: tests/unit/test_rover_usd_override.py parses
# rover.usd and asserts every value below appears in it.  Change a number here
# and that test fails until rover.usd follows.
#
# ⚠️ This file is NOT loaded by the controller.  It is not part of `config/`,
# it has no startup invariant, and nothing in `controller/` may read it — these
# are simulator-side physics values with no counterpart on the real rover.
#
# ⚠️ UNITS.  UsdPhysics authors ANGULAR drives in DEGREES, not radians:
# rover_base.usd carries `physxJoint:maxJointVelocity = 330.67688`, which is
# the URDF's 5.7714 rad/s written as deg/s.  So `damping` below is N·m·s/deg.
# The Python side commands rad/s and isaacsim.core converts — the boundary is
# sim/isaac/adapters/wheel_adapter.py and it is unit-tested.

wheel_drive:
  # Velocity drive: stiffness MUST be 0.  A velocity-driven joint with any
  # stiffness behaves like a position drive, and the wheels fight the target
  # instead of holding it.
  stiffness_n_m_per_deg: 0.0
  damping_n_m_s_per_deg: 0.005

  # max_force is NOT authored here on purpose.  It is the gearbox's continuous
  # torque limit (10 N·m), it comes from the URDF's <limit effort=...>, and
  # rover_base.usd already carries it.  Restating it here would put a BOM
  # number in two places, which is exactly the drift the two-layer split
  # exists to prevent.

friction:
  # ⚠️ THESE VALUES ARE INHERITED FROM A 1.038 kg ROVER AND ARE NOT VALID.
  #
  # The table that used to be here measured a 1.038 kg rover on 0.035 m wheels
  # with a 25 mm line contact.  This machine is 35 kg on 0.125 m wheels with a
  # 90 mm contact and 3.6x the track.  Every row of that table is about a
  # different vehicle, so it has been removed rather than left to be misread.
  #
  # What the old table did establish, and what carries over as a QUESTION
  # rather than an answer: straight-line driving was right at every friction
  # setting, turning was not, and lowering friction by a factor of 45 moved the
  # yaw from 1.10 to 1.57 deg/s against a commanded 40.  The conclusion was
  # that friction is not the knob -- the contact model is -- and that the real
  # lever is the wheel and running gear (V1-ISAAC.md#risks section 3).
  #
  # This change pulls that lever for the first time: the contact is now 90 mm
  # wide instead of 25, on a wheel 3.6x the radius, at 34x the mass.  Whether
  # that fixes the yaw is the first thing Stage 3 must measure, BEFORE touching
  # any number in this file.
  #
  # Re-measure on flat ground, 3 s per case, and put the new table here:
  #   drive(160, 0)  -> expect 160 mm/s
  #   drive(0, 25)   -> expect 25 deg/s     <-- the one that was broken
  #   drive(160, 25) -> expect the mixing table's 66.2 / 253.8 mm/s
  #
  # Do NOT keep lowering `static` to chase the yaw.  That was the trap last
  # time and the file said so.
  static: 0.15
  dynamic: 0.12
  restitution: 0.0

  # PhysX averages the two materials in a contact by default, which would put
  # half of the decisive number in the ground instead of here — and Stage 4
  # replaces the ground with a soil heightfield.  "min" keeps this file
  # authoritative as long as the ground is grippier, which sim/isaac/world.py
  # guarantees by giving the ground plane a higher coefficient than either
  # value above.
  combine_mode: min

collision:
  # Isaac's default contact offset is 0.02 m -- 57% of the old 0.035 m wheel
  # radius, 16% of the new 0.125 m one, and in both cases large enough to
  # generate contacts well before the wheel touches.
  #
  # 0.004 is held at its absolute value, not at a fixed ratio: it was 11% of
  # the old radius and is 3.2% of the new one.  It is the absolute offset,
  # not the ratio, that keeps contacts tight, and 0.004 m is still
  # comfortably small against a 0.125 m wheel.
  contact_offset_m: 0.004
  rest_offset_m: 0.0

solver:
  # Four wheels on one rigid chassis is a small articulation, but the yaw is
  # sensitive to this: 4 position iterations gave 0.28 deg/s on drive(0, 40),
  # 16 gave 1.10, 32 gave 1.32, 64 gave 1.75.  32 is where the return flattens
  # against CI run time.  Velocity iterations stay at 1 — PhysX warns that more
  # than 4 on a TGS scene changed behaviour.
  position_iterations: 32
  velocity_iterations: 1

sleep:
  # Off, deliberately.  A parked articulation accepts a velocity target and
  # silently ignores it, which reads exactly like a broken drive — and it bites
  # hardest when turning on the spot, where the body barely moves.  See the
  # comment in rover.usd.
  threshold: 0.0
  stabilization_threshold: 0.0
