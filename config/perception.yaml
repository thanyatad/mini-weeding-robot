# perception.yaml — ExG floor, confidence, loop rate, corridor, weed area
#
# `exg_floor` เป็นค่าเดียวใน pipeline ที่ต้อง tune ด้วยมือ — Otsu ต่อเฟรมจัดการ
# สีดินที่เปลี่ยนตามความชื้นเอง แต่เมื่อไม่มีสีเขียวในเฟรมเลย Otsu จะแบ่ง noise
# ออกเป็นสองกองแล้วคืน mask ที่ดูเหมือนมีพืช `exg_floor` เป็นพื้นกันข้อนี้
#
# `green_fraction_row_end` คือเส้นที่แยก `row_end` ออกจาก `row_lost` (§5.4) — อยู่ที่นี่
# เพราะมันเป็นสมบัติของ mask ที่ ExG ผลิต ถ้า `exg_floor` หรือ asset พืชเปลี่ยน ค่านี้ขยับตาม
#
# `max_lateral_error_mm` กำหนดความกว้าง corridor:
#   corridor = clear_furrow − 2 × max_lateral_error_mm = 690 − 80 = 610 mm
#
# กล้องล่างต้องครอบ corridor + ขอบข้างละ 20 = 650 mm ที่ความสูง 850 mm
#   HFOV ที่ต้องการ = 2 × atan(325 / 850) = 41.9°  ->  เลนส์ >= 45°

perception:
  loop_hz: 10                  # front camera / control loop
  camera_timeout_ms: 300

  exg:
    exg_floor: 12              # ต้อง tune ด้วยมือ — ดู config/README.md#exg_floor

  row_estimator:
    conf_min: 0.25             # valley prominence ขั้นต่ำ
    green_fraction_row_end: 0.10   # สมมติฐาน — ยังไม่ถูก validate ต้องวัดที่ V1
    front_downscale: [320, 240]

  weed_detector:
    max_lateral_error_mm: 40   # สมมติฐาน — ต้องวัดที่ V1
    min_weed_area_mm2: 60
    down_rate_hz: 2
