; PlatformIO project for the ESP32 low-level controller.
;
; Two environments, as firmware/esp32/README.md#build--test requires:
;
;   [env:esp32dev]   the real board
;   [env:native]     the host — runs test/test_mixing.cpp without any hardware
;
; Only mixing.cpp exists at V0.  main.cpp / motors.cpp / safety.cpp /
; communication.cpp arrive at V3, when there is a board to run them on.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=c++11 -Wall -Wextra

; The golden-vector test must exercise the SAME translation unit the firmware
; ships, not a copy of the formula pasted into the test.  test_build_src pulls
; src/ into the host build; build_src_filter then admits mixing.cpp and nothing
; else, because the rest of src/ is Arduino-only and cannot compile here.
test_build_src = yes
build_src_filter = -<*> +<mixing.cpp>
